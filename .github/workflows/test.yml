name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme LifeboatKit -destination 'generic/platform=iOS Simulator' build -quiet
